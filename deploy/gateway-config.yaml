# NOTE: secrets do NOT belong in this file and are not read from it.
# The JWT signing secret is read from the JWT_SECRET environment variable only
# (see deploy/README.md). A `jwt_secret:` key used to sit here expanding
# ${DOJO_JWT_SECRET}; nothing in the Go code ever loaded either one, so a host
# configured through them signed every session with the built-in development
# secret. Put JWT_SECRET in /etc/dojo/env instead — do not re-add it here.

port: 7340
environment: production
data_dir: /var/lib/dojo

# REGISTRATION IS CLOSED ON gateway.trespies.dev. It is closed by
# REGISTRATION_ENABLED=false in /etc/dojo/env, not by this line (DGS-101,
# 2026-08-04). A sign-up used to return a real role=user access token, which is
# a working /v1 credential and re-entry for anything gated on auth alone.
#
# This key stays `true` on purpose. A config file can only OPEN registration —
# see applyRegistrationFileValue in server/config — so writing `false` here
# would be silently inert and would read as a closure that is not happening.
# The asymmetry exists because already-deployed copies of this file said
# `false` from when the key was unparsed, and a restart must not close a
# service on the strength of a line nobody knew was live.
#
# To close registration on a host: set REGISTRATION_ENABLED=false in
# /etc/dojo/env and restart. provision.sh never overwrites that file (it only
# creates it when absent), so the setting survives a re-provision.
registration_enabled: true

providers:
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
  openai:
    api_key: "${OPENAI_API_KEY}"

oauth:
  github:
    enabled: true
    client_id: "${GITHUB_OAUTH_CLIENT_ID}"
    client_secret: "${GITHUB_OAUTH_CLIENT_SECRET}"
    redirect_uri: "https://gateway.trespies.dev/auth/github/callback"
