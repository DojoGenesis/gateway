# NOTE: secrets do NOT belong in this file and are not read from it.
# The JWT signing secret is read from the JWT_SECRET environment variable only
# (see deploy/README.md). A `jwt_secret:` key used to sit here expanding
# ${DOJO_JWT_SECRET}; nothing in the Go code ever loaded either one, so a host
# configured through them signed every session with the built-in development
# secret. Put JWT_SECRET in /etc/dojo/env instead — do not re-add it here.

port: 7340
environment: production
data_dir: /var/lib/dojo

# Public sign-up is deliberate on this deployment: anyone may register and use
# the chat. This key used to read `false` while no Go code parsed it, so the
# gateway ran open regardless — the file said one thing and the service did
# another for months. It is parsed now, so it states what is actually wanted.
#
# A config file can only OPEN registration; to close it, set
# REGISTRATION_ENABLED=false in /etc/dojo/env. That asymmetry exists because
# already-deployed copies of this file still say `false` from when the key was
# inert, and a restart must not close a service on the strength of a line
# nobody knew was live. See applyRegistrationFileValue in server/config.
registration_enabled: true

providers:
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
  openai:
    api_key: "${OPENAI_API_KEY}"

oauth:
  github:
    enabled: true
    client_id: "${GITHUB_OAUTH_CLIENT_ID}"
    client_secret: "${GITHUB_OAUTH_CLIENT_SECRET}"
    redirect_uri: "https://gateway.trespies.dev/auth/github/callback"
