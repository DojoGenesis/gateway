
# Production stack — Hetzner VPS + Named Cloudflare Tunnel
#
# Images:
#   gateway  — ghcr.io/dojogenesis/agentic-gateway:latest  (GoReleaser)
#   bridge   — ghcr.io/dojogenesis/dojo-bridge:latest      (CI deploy workflow)
#   tunnel   — cloudflare/cloudflared                           (named tunnel, permanent URL)
#
# Host: dojo-bridge (37.27.182.173) — deployed at /opt/dojo/docker-compose.yml.
#
# THIS FILE IS THE WHOLE DESCRIPTION OF THAT BOX. Reconciled 2026-08-03 from the
# live host: it was missing mcp-http, memory-db, and the memory-db-data volume,
# so a rebuild from this repo would have silently dropped the public MCP
# endpoint (mcp.trespiesdesign.com) and the Memory Hub. If you add or change a
# service on the box, change it HERE in the same commit.
#
# Note: provision.sh does NOT write this file (it writes only the Caddyfile,
# gateway config, and systemd unit), so /opt/dojo edits are safe from
# re-provisioning — but they are also invisible until copied back here.
#
# Secrets: source .env before running (Infisical bootstrap vars only).
# All channel credentials live in Infisical — not in this file.
# Required in /opt/dojo/.env: MEMORY_DB_PASSWORD, DOJO_MCP_API_KEYS,
# DOJO_MEMORY_DB_URL_RO, DOJO_GATEWAY_URL, DOJO_GATEWAY_TOKEN.
#
# First deploy:
#   1. Run scripts/server-setup.sh on the VPS
#   2. Copy this file + cloudflared/config.yaml + .env to /opt/dojo/
#   3. docker compose pull && docker compose up -d

services:

  # ─── Channel Bridge ────────────────────────────────────────────────────────
  # Receives inbound webhooks from Slack, Discord, etc. on port 8090.
  # Public via Cloudflare Tunnel — Infisical fetches credentials at startup.
  bridge:
    image: ghcr.io/dojogenesis/dojo-bridge:latest
    restart: unless-stopped
    environment:
      # Infisical removed 2026-07-26: unused backend (bws is the org store) and the
      # client secret could not be rotated -- no Infisical account. "env" is the
      # default per cmd/dojo/bridge.go; adapters missing creds are skipped, not fatal.
      DOJO_CREDENTIAL_BACKEND: "env"
      DOJO_BRIDGE_PORT: "8090"
      DOJO_DATA_DIR: "/app/data"
    volumes:
      - bridge-data:/app/data
    networks:
      - dojo-prod
    healthcheck:
      test: ["NONE"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Cloudflare Tunnel ─────────────────────────────────────────────────────
  # Named tunnel — permanent URL: https://bridge.trespiesdesign.com
  # Routes /webhooks/* to the bridge service on port 8090.
  # Credentials file is mounted from ./cloudflared/<TUNNEL-UUID>.json
  tunnel:
    image: cloudflare/cloudflared:2026.3.0
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yaml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - dojo-prod
    depends_on:
      bridge:
        condition: service_started

  # ─── Agentic Gateway — REMOVED 2026-08-03 (DGS-104) ────────────────────────
  # This box ran a SECOND gateway (v3.3.2) that crash-looped 6,586 times: it
  # fails closed because JWT_SECRET is unset and it will not sign tokens with
  # the development default committed to the repo. Production traffic is served
  # by gateway.trespies.dev on pdi-dojo-1 (v1.1.0), so this one had no consumer
  # once mcp-http was repointed. Full service definition is in git history:
  # DojoGenesis/gateway, deployments/prod/docker-compose.yml before this change.
  # The gateway-data and mcp-bin volumes are left declared so nothing is orphaned.

  # ─── MCP Binary Provider ───────────────────────────────────────────────────
  # Canonical image (DojoGenesis/mcp CI), DIGEST-PINNED — retires the old
  # manually-pushed mcpbydojogenesis:latest (OCH-132). Bump digest to deploy.
  mcp-by-dojo:
    image: ghcr.io/dojogenesis/mcp@sha256:70189d313063286b88017f8035ec367686176aa647936747ec4f7a1c308784d4
    user: "0:0"
    volumes:
      - mcp-bin:/opt/mcp-servers
    entrypoint: ["sh", "-c", "cp /app/server /opt/mcp-servers/mcp-by-dojo-genesis && chmod +x /opt/mcp-servers/mcp-by-dojo-genesis"]
    networks:
      - dojo-prod

  # ─── Public dojo MCP endpoint (OCH-132 Lane B) ─────────────────────────────
  # Streamable-HTTP MCP behind Bearer-key auth. Ingress ONLY via the named
  # Cloudflare tunnel (mcp.trespiesdesign.com) — never port-published.
  # DIGEST-PINNED on purpose: the 03:00 auto-pull must not surprise-deploy a
  # new public surface. Bumping the digest here IS the deliberate deploy act.
  mcp-http:
    image: ghcr.io/dojogenesis/mcp@sha256:70189d313063286b88017f8035ec367686176aa647936747ec4f7a1c308784d4
    restart: unless-stopped
    environment:
      DOJO_HTTP_ADDR: ":8091"
      DOJO_MCP_API_KEYS: "${DOJO_MCP_API_KEYS}"
      DOJO_DISPATCH_ALLOWED_LABELS: "${DOJO_DISPATCH_ALLOWED_LABELS:-}"
      DOJO_DISPATCH_RATE_PER_MIN: "${DOJO_DISPATCH_RATE_PER_MIN:-6}"
      DOJO_MEMORY_DB_URL: "${DOJO_MEMORY_DB_URL_RO}"
      DOJO_GATEWAY_URL: "${DOJO_GATEWAY_URL:-https://gateway.trespies.dev}"
      DOJO_GATEWAY_TOKEN: "${DOJO_GATEWAY_TOKEN:-}"
      DOJO_SKILLS_PATH: "/opt/coworkplugins"
      DOJO_ADR_PATH: "/app/decisions"
    volumes:
      - /opt/dojo/coworkplugins:/opt/coworkplugins:ro
      - /opt/dojo/mcp-adrs:/app/decisions
    networks:
      - dojo-prod
    depends_on:
      memory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── OTEL Collector ────────────────────────────────────────────────────────
  # Optional — set OTEL_ENABLED=true in .env to activate telemetry.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    restart: unless-stopped
    volumes:
      - ./otel-config.yaml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    networks:
      - dojo-prod
    profiles:
      - observability

  # ─── Langfuse ──────────────────────────────────────────────────────────────
  # Optional — run with: docker compose --profile observability up -d
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # localhost only
    environment:
      DATABASE_URL: "postgresql://langfuse:${POSTGRES_PASSWORD:-langfuse_password}@postgres:5432/langfuse"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET}"
      SALT: "${LANGFUSE_SALT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dojo-prod
    profiles:
      - observability

  # ─── PostgreSQL (Langfuse only) ────────────────────────────────────────────
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-langfuse_password}"
      POSTGRES_DB: langfuse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dojo-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - observability

  # --- Memory Hub: Postgres memory DB (additive 2026-06-22, Route B; localhost :5433) ---
  memory-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dojo_memory
      POSTGRES_PASSWORD: "${MEMORY_DB_PASSWORD:?set MEMORY_DB_PASSWORD in /opt/dojo/.env}"
      POSTGRES_DB: dojo_memory
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - memory-db-data:/var/lib/postgresql/data
    networks:
      - dojo-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dojo_memory -d dojo_memory"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  dojo-prod:
    driver: bridge

volumes:
  memory-db-data:
  bridge-data:
  gateway-data:
  mcp-bin:
  postgres-data:
